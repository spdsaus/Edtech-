name: Prototype build checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, mvp-readiness-cleanup]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
